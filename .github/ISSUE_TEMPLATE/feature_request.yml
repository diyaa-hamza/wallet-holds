name: Feature request
description: An operation, read or option the module does not have
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The payment or wallet flow you need, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you add or change?
      description: If you have the postings in mind, write them as `source -> destination`.
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
